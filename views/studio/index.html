<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>浮生绘卷</title>
  <link rel="stylesheet" href="./app.css">
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="studio">
    <div id="notice" role="status" aria-live="polite" aria-atomic="true" hidden><span id="notice-symbol" aria-hidden="true"></span><span id="notice-message"></span><button id="notice-close" aria-label="关闭提示" type="button"><span data-icon="x"></span></button></div>
    <div id="conversion-notice" class="notice" role="status" hidden></div>
    <main id="collection" class="collection" aria-labelledby="studio-title">
      <header id="collection-heading" class="collection-heading">
        <div class="brand"><img class="brand-mark" src="./logo.png" width="52" height="52" alt=""><div><h1 id="studio-title">浮生绘卷</h1><p id="collection-title">你的角色，各有故事。</p></div></div>
        <div id="studio-actions" class="actions"><button id="import-button"><span data-icon="upload"></span>导入角色</button><button id="new-button" class="primary"><span data-icon="plus"></span>新建角色</button></div>
      </header>
      <div class="collection-toolbar">
        <div class="collection-filters" role="group" aria-label="角色库范围"><button data-collection="active" aria-pressed="true">全部角色 <span id="card-count" class="count">0</span></button><button data-collection="archived" aria-pressed="false"><span data-icon="archive"></span>已归档</button></div>
        <div class="collection-tools"><label class="search-field"><span data-icon="search"></span><span class="sr-only">搜索角色名称、简介或标签</span><input id="search" type="search" placeholder="搜索角色"></label><button id="refresh-button" class="icon-button" aria-label="刷新角色库"><span data-icon="refresh"></span></button></div>
      </div>
      <div id="card-list" class="card-grid" aria-label="角色列表" aria-live="polite"><div class="empty-state"><span class="loading-dot" aria-hidden="true"></span><h3>正在连接 AstrBot…</h3><p>准备你的角色库</p></div></div>
      <footer class="collection-footer">Character Card V3 <span aria-hidden="true">·</span> 支持导入 V2 / V3 JSON 与 PNG</footer>
    </main>
    <main id="workspace" class="workspace" aria-label="角色编辑工作台" hidden>
      <div id="editor-topline" class="editor-topline"><div class="editor-navigation"><button data-action="back" class="quiet"><span data-icon="arrow-left"></span>返回角色库</button><label class="card-switcher"><span class="sr-only">切换编辑角色</span><select id="card-switcher" aria-label="切换编辑角色"></select></label></div></div>
      <div id="editor"></div>
    </main>
    <input id="upload" type="file" accept=".json,.png,application/json,image/png" hidden>
    <input id="image-upload" type="file" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" hidden>
    <dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="关闭弹窗">关闭</button></div><div id="dialog-body"></div></dialog>
    <dialog id="confirm-dialog"><h2>确认操作</h2><p id="confirm-text"></p><div class="dialog-footer"><button data-confirm="cancel">取消</button><button data-confirm="confirm" class="primary">确认</button></div></dialog>
  </div>
</body>
</html>
